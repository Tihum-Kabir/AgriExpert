<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Soil Trends</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: rgb(0, 0, 0);
        padding-left: 20px;
        padding-right: 20px;
      }

      header .nav {
        display: flex;
        gap: 30px;
      }

      header .nav a {
        color: rgb(0, 0, 0);
        font-weight: bold;
        text-decoration: none;
      }
      body {
        font-family: Arial, sans-serif;
        padding: 40px;
        background-color: #f4fff4;
      }
      h2 {
        margin-bottom: 20px;
        color: #2e7d32;
      }
      canvas {
        max-width: 100%;
        max-height: 500px;
        margin-bottom: 50px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 class="logo">Trends</h1>
      <div class="nav">
        <a href="dashboard.html">Home</a>
        <a href="index.html">Logout</a>
      </div>
    </header>
    <h2>Soil pH Trend Over Time</h2>
    <canvas id="phChart"></canvas>

    <h2>Moisture Level Trend</h2>
    <canvas id="moistureChart"></canvas>

    <script>
      const userId =
        localStorage.getItem("userId") || sessionStorage.getItem("userId");
      if (!userId) {
        alert("User not logged in");
        window.location.href = "login.html";
      }

      fetch(`user_records.php?userId=${userId}`)
        .then((res) => res.json())
        .then((data) => {
          if (data.status === "success") {
            const records = data.records.reverse(); // show oldest to newest
            const labels = records.map((r) =>
              new Date(r.created_at).toLocaleDateString()
            );

            const phData = records.map((r) => r.soilPh);
            const moistureData = records.map((r) => {
              if (r.moisture === "Low") return 10;
              if (r.moisture === "Medium") return 35;
              if (r.moisture === "High") return 70;
              return 0;
            });

            new Chart(document.getElementById("phChart"), {
              type: "line",
              data: {
                labels: labels,
                datasets: [
                  {
                    label: "Soil pH",
                    data: phData,
                    borderColor: "green",
                    fill: false,
                  },
                ],
              },
              options: {
                responsive: true,
              },
            });

            new Chart(document.getElementById("moistureChart"), {
              type: "line",
              data: {
                labels: labels,
                datasets: [
                  {
                    label: "Moisture (%)",
                    data: moistureData,
                    borderColor: "blue",
                    fill: false,
                  },
                ],
              },
              options: {
                responsive: true,
              },
            });
          } else {
            alert("Could not load records.");
          }
        });
    </script>
  </body>
</html>
