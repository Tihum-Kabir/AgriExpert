<!DOCTYPE html>
<html>
  <head>
    <title>Past Soil Reports</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: rgb(0, 0, 0);
        padding-left: 20px;
        padding-right: 20px;
      }

      header .nav {
        display: flex;
        gap: 30px;
      }

      header .nav a {
        color: rgb(0, 0, 0);
        font-weight: bold;
        text-decoration: none;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }
      th,
      td {
        border: 1px solid #ccc;
        padding: 8px;
        text-align: center;
      }
      th {
        background-color: #f0f0f0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 class="logo">Past Soil Reports</h1>
      <div class="nav">
        <a href="dashboard.html">Home</a>
        <a href="index.html">Logout</a>
      </div>
    </header>
    <table id="soilTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>User ID</th>
          <th>pH</th>
          <th>Moisture</th>
          <th>N</th>
          <th>P</th>
          <th>K</th>
          <th>Soil Type</th>
          <th>Fertilizer</th>
          <th>Products</th>
          <th>Crops</th>
          <th>Time</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <script>
      fetch("fetch_soil_data.php")
        .then((res) => res.json())
        .then((json) => {
          if (json.status === "success") {
            const tbody = document.querySelector("#soilTable tbody");
            json.data.forEach((row) => {
              const tr = document.createElement("tr");
              tr.innerHTML = `
              <td>${row.id}</td>
              <td>${row.userId}</td>
              <td>${row.soilPh}</td>
              <td>${row.moisture}</td>
              <td>${row.nitrogen}</td>
              <td>${row.phosphorus}</td>
              <td>${row.potassium}</td>
              <td>${row.soilType}</td>
              <td>${row.fertilizerText}</td>
              <td>${row.fertilizerProducts}</td>
              <td>${row.cropRecommendations}</td>
              <td>${row.timestamp}</td>
            `;
              tbody.appendChild(tr);
            });
          } else {
            alert("Error loading data: " + json.message);
          }
        });
    </script>
  </body>
</html>
